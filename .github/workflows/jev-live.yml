# Manual only. Never run on pull_request.
name: jev-live

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: live Jev via Vercel Gateway
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AI_GATEWAY_API_KEY:-}" ]; then
            echo "secret AI_GATEWAY_API_KEY is empty"
            exit 1
          fi
          python3 scripts/ci_live.py
